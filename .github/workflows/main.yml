
name: Build AK9SHOT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o AK9SHOT-Android-Source.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p AK9SHOT assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK9SHOT-APK
          path: AK9SHOT/app/build/outputs/apk/debug/app-debug.apk
